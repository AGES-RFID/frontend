name: Push on Trunk

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-and-build:
    name: CI
    uses: AGES-RFID/cicd/.github/workflows/ci-bun.yml@main
    with:
      public_api_url: ${{ vars.PUBLIC_API_URL }}
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  deploy-staging:
    name: CD Staging
    needs: [validate-and-build]
    uses: AGES-RFID/cicd/.github/workflows/deployment-s3.yml@main
    with:
      environment: "staging"
      version: ${{ github.sha }}
    secrets: inherit
